<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>見微理畫 - 互動式理化學習平台</title>
<link rel="stylesheet" href="./assets/css/storybook.css">
<style>
    body {
        background-color: #ffffff;
        color: #1e293b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        margin: 0; padding: 0;
    }
    header {
        max-width: 1000px;
        margin: 80px auto 60px auto;
        padding: 0 20px;
        text-align: center;
    }
    header h1 {
        font-size: 3.5rem;
        color: #0f172a;
        margin-bottom: 15px;
        font-weight: 800;
        letter-spacing: 2px;
    }
    header p {
        color: #64748b;
        font-size: 1.2rem;
        line-height: 1.6;
        max-width: 600px;
        margin: 0 auto;
    }
    .catalog-container {
        max-width: 1100px;
        margin: 0 auto 60px auto;
        padding: 0 20px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 30px;
    }
    .catalog-card {
        background-color: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        transition: box-shadow 0.2s, transform 0.2s;
    }
    .catalog-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        border-color: #cbd5e1;
    }
    .catalog-card h3 {
        font-size: 1.2rem;
        color: #2563eb;
        margin-top: 0;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid #f1f5f9;
    }
    .unit-list { list-style: none; padding: 0; margin: 0; }
    .unit-list li { margin-bottom: 8px; }
    .unit-list a {
        text-decoration: none;
        color: #475569;
        font-size: 1rem;
        display: block;
        padding: 8px 12px;
        border-radius: 6px;
        transition: background-color 0.2s, color 0.2s;
    }
    .unit-list a:hover {
        background-color: #eff6ff;
        color: #1d4ed8;
        font-weight: 600;
    }
</style>
</head>
<body>
<header>
    <h1>見微理畫</h1>
    <p>透過互動式參數與視覺圖解，看見隱藏在公式背後的科學邏輯。不需死記硬背，親手體驗物理與化學的運作法則。</p>
</header>
<main>
    <div id="catalog-root" class="catalog-container"></div>
</main>
<script src="./assets/js/catalog.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const catalogRoot = document.getElementById('catalog-root');
        catalog.forEach(bookData => {
            bookData.chapters.forEach(chapter => {
                const card = document.createElement('div');
                card.className = 'catalog-card';
                let listItems = '';
                chapter.sections.forEach(section => {
                    listItems += `<li><a href="${section.path}">${section.title}</a></li>`;
                });
                card.innerHTML = `<h3>${bookData.book}：${chapter.ch}</h3><ul class="unit-list">${listItems}</ul>`;
                catalogRoot.appendChild(card);
            });
        });
    });
</script>
</body>
</html>

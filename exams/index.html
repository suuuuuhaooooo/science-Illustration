<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>見微理畫</title>
<meta name="description" content="見微理畫：從微觀的圖解看見巨觀的物理與化學邏輯。">

<!-- 沿用原專案的字體設定，維持手寫與圓潤的視覺風格 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;700&family=LXGW+WenKai+TC:wght@400;700&family=Patrick+Hand&display=swap">

<!-- 引入原專案的核心 CSS -->
<link rel="stylesheet" href="./assets/css/storybook.css">

<style>
    /* 首頁特定的基礎排版，確保不依賴外部檔案即有良好結構 */
    body {
        font-family: 'Chiron GoRound TC', 'LXGW WenKai TC', sans-serif;
        background-color: #fdfaf6;
        color: #4a4542;
        margin: 0;
        padding: 0;
        -webkit-user-select: none;
        user-select: none;
    }
    
    header {
        max-width: 1000px;
        margin: 60px auto 40px auto;
        padding: 0 20px;
        text-align: center;
    }
    
    header h1 {
        font-size: 3rem;
        color: #5c4d43;
        margin-bottom: 10px;
    }
    
    header p {
        color: #9c928a;
        font-size: 1.1rem;
        line-height: 1.6;
    }

    .catalog-container {
        max-width: 1000px;
        margin: 0 auto 60px auto;
        padding: 0 20px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 30px;
    }

    .catalog-card {
        background-color: #ffffff;
        border: 2px solid #f2ece4;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 4px 15px rgba(150, 140, 130, 0.05);
        transition: transform 0.2s ease;
    }

    .catalog-card:hover {
        transform: translateY(-4px);
    }

    .catalog-card h3 {
        font-size: 1.25rem;
        color: #5c4d43;
        margin-top: 0;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 2px dashed #f2ece4;
    }

    .unit-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .unit-list li {
        margin-bottom: 10px;
    }

    .unit-list a {
        text-decoration: none;
        color: #7a7069;
        font-size: 1rem;
        display: block;
        padding: 6px 8px;
        border-radius: 6px;
        transition: background-color 0.2s, color 0.2s;
    }

    .unit-list a:hover {
        background-color: #faf7f2;
        color: #8caba4;
    }
</style>
</head>
<body>

<noscript><p style="padding:2em">這個頁面的互動功能需要開啟 JavaScript。</p></noscript>

<header>
    <h1>見微理畫</h1>
    <p>每一個物理觀念與化學反應，都是一幅可以被看見的圖畫。<br>在這裡，你可以親手拖曳變因、觀察粒子運動，看著圖形一步步推導出公式。</p>
</header>

<main>
    <div id="catalog-root" class="catalog-container">
        <!-- 目錄卡片將由 catalog.js 動態生成於此 -->
    </div>
</main>

<!-- 依循原網站的腳本載入順序 -->
<script src="./assets/js/catalog.js"></script>
<script src="./assets/js/core.js"></script>
<script>
    // 動態渲染目錄卡片
    document.addEventListener("DOMContentLoaded", function() {
        const catalogRoot = document.getElementById('catalog-root');
        
        scienceCatalog.forEach(bookData => {
            bookData.chapters.forEach(chapter => {
                const card = document.createElement('div');
                card.className = 'catalog-card';
                
                let listItems = '';
                chapter.sections.forEach(section => {
                    listItems += `<li><a href="${section.path}">${section.title}</a></li>`;
                });

                card.innerHTML = `
                    <h3>${bookData.book}：${chapter.ch}</h3>
                    <ul class="unit-list">
                        ${listItems}
                    </ul>
                `;
                catalogRoot.appendChild(card);
            });
        });
    });
</script>

</body>
</html>
